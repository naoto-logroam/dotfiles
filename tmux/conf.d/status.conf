# Status line
set-option -g status-interval 5
set-option -g status-position top
set-option -g status-justify "centre"
set-option -g status-left-length 36
set-option -g status-left "#[fg=#101820,bg=#5fff87,bold] #S #[fg=#5fff87,bg=default] #[default] "
set-window-option -g window-status-format "#[fg=#8a8f98,bg=default] #I:#W "
set-window-option -g window-status-current-format "#[fg=#101820,bg=#ae8b2d,bold] #I:#W #[default]"
set-option -g status-right-length 180
set-option -g status-right "#[fg=#8a8f98]#(${HOME}/.bin/tmux-status-google) #[fg=#3a3f46]|#[fg=#8a8f98] Mem #(${HOME}/.bin/tmux-status-mem) #[fg=#3a3f46]|#[fg=#8a8f98] LA #(${HOME}/.bin/tmux-status-load) #[fg=#3a3f46]|#[fg=#5fff87] %m/%d %H:%M#[default]"
