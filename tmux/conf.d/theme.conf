# Use terminal defaults so wezterm opacity remains visible.
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=#101820'
set-option -g status-style fg=default,bg=default
set-window-option -g window-status-style fg=default,bg=default
set-window-option -g window-status-current-style fg=#101820,bg=#ae8b2d,bold
set-option -g pane-border-style fg=default,bg=default
set-option -g pane-active-border-style fg=#5fff87,bg=default,bold
set-option -g message-style fg=default,bg=default
set-window-option -g window-status-bell-style fg=default,bg=default
