# tmux config entrypoint.
# Keep feature settings in ~/dotfiles/tmux/conf.d/*.conf so modules can be shared.

source-file ~/dotfiles/tmux/conf.d/core.conf
source-file ~/dotfiles/tmux/conf.d/mouse.conf
source-file ~/dotfiles/tmux/conf.d/status.conf
source-file ~/dotfiles/tmux/conf.d/panes.conf
source-file ~/dotfiles/tmux/conf.d/theme.conf
source-file ~/dotfiles/tmux/conf.d/keys.conf
