# tmux config entrypoint.
# Keep feature settings in ~/.tmux/conf.d/*.conf so modules can be shared.

source-file ~/.tmux/conf.d/core.conf
source-file ~/.tmux/conf.d/mouse.conf
source-file ~/.tmux/conf.d/status.conf
source-file ~/.tmux/conf.d/panes.conf
source-file ~/.tmux/conf.d/theme.conf
source-file ~/.tmux/conf.d/keys.conf
